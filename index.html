<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- SEO -->
    <title>Index Position Size Calculator | Contract-Based Risk Tool</title>
    <meta
      name="description"
      content="Free index position size calculator for traders. Calculate lot size using account balance, risk %, stop loss points, and contract size. Works for US30, NAS100, SPX500 and more."
    />
    <meta
      name="keywords"
      content="position size calculator, index trading, US30 lot size, contract size calculator, risk management trading"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Open Graph -->
    <meta property="og:title" content="Index Position Size Calculator" />
    <meta
      property="og:description"
      content="Calculate index lot size using contract size and stop loss points."
    />
    <meta property="og:type" content="website" />

    <style>
      :root {
        --bg: #0f172a;
        --card: #111827;
        --accent: #22c55e;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --border: #1f2937;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        background: linear-gradient(180deg, #020617, #020617);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      main {
        width: 100%;
        max-width: 460px;
      }

      .card {
        background: var(--card);
        border-radius: 14px;
        padding: 28px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        border: 1px solid var(--border);
      }

      h1 {
        font-size: 1.5rem;
        margin-bottom: 6px;
      }

      p.subtitle {
        color: var(--muted);
        font-size: 0.95rem;
        margin-bottom: 24px;
      }

      .field {
        margin-bottom: 16px;
      }

      label {
        display: block;
        font-size: 0.85rem;
        margin-bottom: 6px;
        color: var(--muted);
      }

      input {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #020617;
        color: var(--text);
        font-size: 1rem;
      }

      input:focus {
        outline: none;
        border-color: var(--accent);
      }

      button {
        width: 100%;
        margin-top: 12px;
        padding: 14px;
        background: var(--accent);
        color: #052e16;
        font-size: 1rem;
        font-weight: 600;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: transform 0.05s ease, opacity 0.2s;
      }

      button:hover {
        opacity: 0.9;
      }

      button:active {
        transform: scale(0.98);
      }

      .result {
        margin-top: 24px;
        padding: 16px;
        border-radius: 10px;
        background: #020617;
        border: 1px dashed var(--border);
      }

      .result strong {
        color: var(--accent);
        font-size: 1.2rem;
      }

      footer {
        margin-top: 16px;
        text-align: center;
        font-size: 0.75rem;
        color: var(--muted);
      }

      @media (max-width: 420px) {
        h1 {
          font-size: 1.3rem;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <section class="card">
        <h1>Index Position Size Calculator</h1>
        <p class="subtitle">
          Calculate lot size using <strong>contract size</strong>, stop loss
          points, and risk.
        </p>

        <div class="field">
          <label for="balance">Account Balance ($)</label>
          <input id="balance" type="number" placeholder="100000" />
        </div>

        <div class="field">
          <label for="risk">Risk (%)</label>
          <input id="risk" type="number" placeholder="1" />
        </div>

        <div class="field">
          <label for="stop">Stop Loss (points)</label>
          <input id="stop" type="number" placeholder="100" />
        </div>

        <div class="field">
          <label for="contract">Contract Size ($ per point)</label>
          <input id="contract" type="number" placeholder="5 (US30)" />
        </div>

        <button onclick="calculate()">Calculate Lot Size</button>

        <div class="result" id="output">
          Enter values to calculate your position size.
        </div>
      </section>

      <footer>Built for index traders • Risk before reward</footer>
    </main>

    <script>
      function calculate() {
        const balance = Number(document.getElementById("balance").value);
        const risk = Number(document.getElementById("risk").value);
        const stop = Number(document.getElementById("stop").value);
        const contract = Number(document.getElementById("contract").value);

        if (!balance || !risk || !stop || !contract) {
          document.getElementById("output").innerText =
            "Please fill in all fields.";
          return;
        }

        const dollarRisk = balance * (risk / 100);
        const lotSize = dollarRisk / (stop * contract);

        document.getElementById("output").innerHTML = `
        <div>Recommended Lot Size:</div>
        <strong>${lotSize.toFixed(2)} lots</strong>
        <div style="margin-top:8px;color:#9ca3af;">
          Dollar Risk: $${dollarRisk.toFixed(2)}
        </div>
      `;
      }
    </script>
  </body>
</html>
